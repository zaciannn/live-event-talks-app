<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigQuery Release Notes RSS Aggregator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>BigQuery Release Notes</h1>
      <div class="controls">
        <div class="theme-switch-wrapper">
          <span class="theme-switch-label">Dark Mode</span>
          <button id="theme-toggle" class="theme-toggle-switch" aria-label="Toggle Dark Mode">
            <span class="theme-toggle-slider"></span>
          </button>
        </div>
        <button id="refresh-btn">Refresh</button>
        <button id="share-btn" disabled>Share to Twitter</button>
        <button id="export-btn">Export CSV</button>
      </div>
    </header>

    <div id="spinner" class="hidden"></div>
    <div id="message-container"></div>
    <div id="timeline" class="timeline"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
